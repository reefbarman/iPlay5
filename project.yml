name: iPlay5
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # ChiakiKit's simulator slice is arm64 only (Apple silicon Macs)
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    # Release builds override these from the git tag (scripts/package-ipa.sh)
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Git ref that Settings › About › Source code links to. Release builds use their tag
    IPLAY5_SOURCE_REF: main
targets:
  iPlay5:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - framework: Frameworks/ChiakiKit.xcframework
        embed: false
    # Signing team and bundle ID live in Config/Local.xcconfig (see Config/Signing.xcconfig)
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IPLAY5_BUNDLE_ID)
        # iPhone and iPad
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MTL_FAST_MATH: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: iPlay5
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        IPlay5SourceRef: $(IPLAY5_SOURCE_REF)
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.games
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad allows every orientation, which also lets it run in Split View and Stage Manager
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarHidden: false
        UIViewControllerBasedStatusBarAppearance: true
        # Lets ProMotion run above 60 Hz
        CADisableMinimumFrameDurationOnPhone: true
        NSLocalNetworkUsageDescription: iPlay5 finds and connects to your PS5 on the local network for Remote Play.
        NSMicrophoneUsageDescription: iPlay5 sends your voice to your PS5 for game and party chat when Microphone is on in settings.
        # Game controllers can drive the UI and Game Mode kicks in while streaming
        GCSupportsControllerUserInteraction: true
        GCSupportsGameMode: true
        # Debug frame captures show up in Files and Finder
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
          - ProfileName: DualSense
