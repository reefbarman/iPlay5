# GitHub Pages site for iPlay5, built from this folder.
# Every guide here is published as a page; README.md is the in-repo index and is
# excluded because index.md is the site's home page.

title: iPlay5
description: >-
  Free, open-source PS5 Remote Play app for iPhone and iPad. DualSense haptics,
  gyro aiming, HDR and up to 1080p60, tuned for the iPhone Duo. Sideload with
  AltStore or SideStore.
url: https://reefbarman.github.io
baseurl: /iPlay5
lang: en
author: reefbarman

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap

color_scheme: iplay5
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: Back to top
aux_links:
  GitHub: https://github.com/reefbarman/iPlay5
  Download: https://github.com/reefbarman/iPlay5/releases/latest
aux_links_new_tab: true
footer_content: >-
  iPlay5 is open source under AGPL-3.0. Not affiliated with or endorsed by Sony
  Interactive Entertainment. "PlayStation" and "PS5" are trademarks of Sony
  Interactive Entertainment Inc.

exclude:
  - README.md

# Sidebar order and search descriptions live here so the guides stay free of
# front matter and read cleanly on GitHub.
defaults:
  - scope:
      path: ""
    values:
      image: /images/social-preview.jpg
  - scope:
      path: index.md
    values:
      nav_exclude: true
  - scope:
      path: consoles-and-setup.md
    values:
      nav_order: 1
      description: Find and link your PS5 in iPlay5, sign in with PSN, wake it from rest mode, use per-console settings and play away from home.
  - scope:
      path: picture.md
    values:
      nav_order: 2
      description: iPlay5 picture settings for PS5 Remote Play on iPhone and iPad, including resolution, bitrate, H.265, HDR, MetalFX upscaling, 120 Hz and frame generation.
  - scope:
      path: controllers.md
    values:
      nav_order: 3
      description: Use a DualSense, Xbox controller or Backbone with iPlay5, with haptics, adaptive triggers, motion, gyro aiming and the Controller Test.
  - scope:
      path: touch-and-virtual-controls.md
    values:
      nav_order: 4
      description: Play PS5 Remote Play on iPhone without a controller using iPlay5's touchscreen touchpad and on-screen virtual controls.
  - scope:
      path: connection.md
    values:
      nav_order: 5
      description: Get a smooth PS5 Remote Play stream on iPhone with iPlay5's Auto bitrate, Optimise connection, network smoothing and reconnecting.
  - scope:
      path: audio.md
    values:
      nav_order: 6
      description: Game audio, AirPods, microphone and party chat in iPlay5, the PS5 Remote Play app for iPhone and iPad.
  - scope:
      path: stream-screen.md
    values:
      nav_order: 7
      description: iPlay5 stream screen shortcuts, the stream menu, phone battery and heat, typing on the phone and screenshots.
  - scope:
      path: iphone-duo.md
    values:
      nav_order: 8
      description: PS5 Remote Play on the iPhone Duo with iPlay5, including inner and outer screens, folding, and controller and shim recommendations.
  - scope:
      path: troubleshooting.md
    values:
      nav_order: 9
      description: Fix problems with iPlay5 PS5 Remote Play, share diagnostics, capture frames and see known limitations.
  - scope:
      path: licensing.md
    values:
      nav_order: 10
      description: iPlay5 is free and open source under the AGPL v3. Get the source for any version, see bundled components and their licences.
