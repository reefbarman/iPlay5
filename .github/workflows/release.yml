# Push a tag like v0.2.0 to build an unsigned IPA, attach it to a GitHub
# release and add it to the SideStore/AltStore source. In parallel, a signed
# build is uploaded to TestFlight when the App Store Connect secrets are set.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ipa:
    # The app uses iOS 27 SDK APIs, which macos-latest's Xcode doesn't have
    runs-on: xcode-27
    steps:
      # Submodules are only fetched by the ChiakiKit action, and only on a cache miss
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: ./.github/actions/chiakikit

      - name: Install tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install xcodegen
          # Newer Xcodes ship the Metal compiler as a separate download
          xcodebuild -downloadComponent MetalToolchain || true

      - name: Build IPA
        run: VERSION="${GITHUB_REF_NAME#v}" BUILD_NUMBER="${{ github.run_number }}" scripts/package-ipa.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/iPlay5.ipa --title "iPlay5 $GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" build/iPlay5.ipa --clobber

      - name: Update sideload source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          scripts/update-source.sh "${GITHUB_REF_NAME#v}" build/iPlay5.ipa \
            "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/iPlay5.ipa"
          git add altstore-source.json
          git commit -m "chore: add ${GITHUB_REF_NAME} to sideload source"
          git push origin main

  # Separate from ipa so a signing or upload failure never blocks the sideload release
  testflight:
    runs-on: xcode-27
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      # Secrets can't be used in a job-level if, so every step checks this instead
      - name: Check App Store Connect secrets
        id: secrets
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] && [ -n "$TEAM_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping TestFlight upload: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 and APPLE_TEAM_ID aren't all set"
          fi

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.enabled == 'true'

      - uses: maxim-lobanov/setup-xcode@v1
        if: steps.secrets.outputs.enabled == 'true'
        with:
          xcode-version: latest-stable

      - uses: ./.github/actions/chiakikit
        if: steps.secrets.outputs.enabled == 'true'

      - name: Install tools
        if: steps.secrets.outputs.enabled == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install xcodegen
          # Newer Xcodes ship the Metal compiler as a separate download
          xcodebuild -downloadComponent MetalToolchain || true

      - name: Write API key
        if: steps.secrets.outputs.enabled == 'true'
        run: |
          umask 077
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      # Run numbers only go up, so they satisfy App Store Connect. A re-run reuses
      # the number and the upload fails as a duplicate, which is the safe outcome.
      - name: Archive and upload to TestFlight
        if: steps.secrets.outputs.enabled == 'true'
        run: |
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" VERSION="${GITHUB_REF_NAME#v}" \
            BUILD_NUMBER="${{ github.run_number }}" scripts/upload-testflight.sh

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
