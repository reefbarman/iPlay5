# Restores Frameworks/ChiakiKit.xcframework from the Actions cache, or builds
# it when the cache misses. Only the submodules the ChiakiKit CMake build uses
# are fetched, and only on a miss.
#
# Caches saved from a tag run are only visible to that tag, so releases restore
# what chiakikit-cache.yml saves on main rather than saving their own.
name: ChiakiKit
description: Restore or build the device-only ChiakiKit.xcframework
inputs:
  save:
    description: Save the framework to the cache after building it
    default: "false"
outputs:
  cache-hit:
    description: Whether the framework came from the cache
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Compute ChiakiKit cache key
      id: key
      shell: bash
      env:
        SLICES: ios
      run: |
        # Submodule pins (nested ones are pinned by their parent's commit),
        # the CMake wrapper, the build script and the toolchain.
        inputs=$( {
          git ls-tree -r HEAD vendor ChiakiKit scripts/build-chiaki.sh
          xcodebuild -version
          echo "slices=$SLICES"
        } | shasum -a 256 | cut -c1-16)
        echo "key=chiakikit-$inputs" >> "$GITHUB_OUTPUT"

    - name: Restore ChiakiKit
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: Frameworks/ChiakiKit.xcframework
        key: ${{ steps.key.outputs.key }}

    - name: Fetch ChiakiKit sources
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: |
        git submodule update --init --depth 1 vendor/chiaki-ng vendor/mbedtls vendor/opus
        git -C vendor/mbedtls submodule update --init --depth 1 framework
        git -C vendor/chiaki-ng submodule update --init --depth 1 \
          third-party/nanopb third-party/gf-complete third-party/jerasure

    - name: Build ChiakiKit
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        SLICES: ios
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
      run: |
        command -v cmake >/dev/null && command -v ninja >/dev/null || brew install cmake ninja
        scripts/build-chiaki.sh

    - name: Save ChiakiKit
      if: inputs.save == 'true' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: Frameworks/ChiakiKit.xcframework
        key: ${{ steps.key.outputs.key }}
